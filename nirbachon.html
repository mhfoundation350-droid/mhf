<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>৭নং হাজিরহাট ইউনিয়ন - বাবুল</title>
<style>
body { font-family: sans-serif; background: #E3F2FD; padding: 10px; }
h1 { text-align: center; color: #0D47A1; margin-bottom: 5px; }
h3 { text-align: center; color: #1565C0; }
.login, .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px #ccc; margin-bottom: 15px; }
input, select, button { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
button { background: #1976D2; color: white; font-weight: bold; border: none; }
.btn-add { background: #388E3C; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
th { background: #1976D2; color: white; padding: 8px; }
td { padding: 8px; text-align: center; border-bottom: 1px solid #eee; }
#app { display:none; }
.total-box { display:flex; justify-content:space-around; background:#FFF3E0; padding:10px; border-radius:8px; font-weight:bold; }
</style>
</head>
<body>

<h1>৭নং হাজিরহাট ইউনিয়ন পরিষদ</h1>
<h3>চেয়ারম্যান পদপ্রার্থী: মোহাম্মদ বাবুল</h3>

<div class="login" id="loginBox">
  <h4>এডমিন লগইন</h4>
  <input type="password" id="pass" placeholder="পাসওয়ার্ড দিন">
  <button onclick="login()">ঢুকুন</button>
  <p style="font-size:12px;">ডেমো পাসওয়ার্ড: babu123</p>
</div>

<div id="app">
  <div class="card">
    <h4>ওয়ার্ড দ্বায়িত্বশীল এড করুন</h4>
    <select id="wardSelect">
      <option>১নং ওয়ার্ড</option><option>২নং ওয়ার্ড</option><option>৩নং ওয়ার্ড</option>
      <option>৪নং ওয়ার্ড</option><option>৫নং ওয়ার্ড</option><option>৬নং ওয়ার্ড</option>
      <option>৭নং ওয়ার্ড</option><option>৮নং ওয়ার্ড</option><option>৯নং ওয়ার্ড</option>
    </select>
    <input type="text" id="leaderName" placeholder="দ্বায়িত্বশীলের নাম">
    <input type="tel" id="leaderPhone" placeholder="মোবাইল নাম্বার">
    <button class="btn-add" onclick="addLeader()">দ্বায়িত্বশীল সেভ করুন</button>
  </div>

  <div class="card">
    <h4>ভোটার এন্ট্রি</h4>
    <select id="voteWard">
      <option>১নং ওয়ার্ড</option><option>২নং ওয়ার্ড</option><option>৩নং ওয়ার্ড</option>
      <option>৪নং ওয়ার্ড</option><option>৫নং ওয়ার্ড</option><option>৬নং ওয়ার্ড</option>
      <option>৭নং ওয়ার্ড</option><option>৮নং ওয়ার্ড</option><option>৯নং ওয়ার্ড</option>
    </select>
    <input type="text" id="voterName" placeholder="ভোটারের নাম">
    <input type="text" id="voterPhone" placeholder="ভোটারের নাম্বার - ঐচ্ছিক">
    <button onclick="addVoter()">ভোটার যোগ করুন</button>
  </div>

  <div class="total-box">
    <div>মোট ভোটার: <span id="totalVoter">0</span></div>
    <div>মোট নেতা: <span id="totalLeader">0</span></div>
  </div>

  <div class="card">
    <h4>ওয়ার্ড দ্বায়িত্বশীল তালিকা</h4>
    <table id="leaderTable"><tr><th>ওয়ার্ড</th><th>নাম</th><th>নাম্বার</th></tr></table>
  </div>

  <div class="card">
    <h4>ভোটার তালিকা</h4>
    <table id="voterTable"><tr><th>ওয়ার্ড</th><th>নাম</th><th>নাম্বার</th></tr></table>
  </div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('hazirhatData')) || {leaders:[], voters:[]};

function login(){
  if(document.getElementById('pass').value == 'babu123'){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('app').style.display='block';
    updateAll();
  } else { alert('পাসওয়ার্ড ভুল') }
}

function saveData(){ localStorage.setItem('hazirhatData', JSON.stringify(data)); }

function addLeader(){
  let w = document.getElementById('wardSelect').value;
  let n = document.getElementById('leaderName').value;
  let p = document.getElementById('leaderPhone').value;
  if(!n || !p) return alert('নাম ও নাম্বার দিন');
  data.leaders.push({ward:w, name:n, phone:p});
  saveData(); updateAll();
  document.getElementById('leaderName').value=''; document.getElementById('leaderPhone').value='';
}

function addVoter(){
  let w = document.getElementById('voteWard').value;
  let n = document.getElementById('voterName').value;
  let p = document.getElementById('voterPhone').value;
  if(!n) return alert('ভোটারের নাম দিন');
  data.voters.push({ward:w, name:n, phone:p});
  saveData(); updateAll();
  document.getElementById('voterName').value=''; document.getElementById('voterPhone').value='';
}

function updateAll(){
  // Leaders
  let lt = document.getElementById('leaderTable');
  lt.innerHTML = '<tr><th>ওয়ার্ড</th><th>নাম</th><th>নাম্বার</th></tr>';
  data.leaders.forEach(l => {
    lt.insertRow().innerHTML = `<td>${l.ward}</td><td>${l.name}</td><td>${l.phone}</td>`;
  });
  // Voters
  let vt = document.getElementById('voterTable');
  vt.innerHTML = '<tr><th>ওয়ার্ড</th><th>নাম</th><th>নাম্বার</th></tr>';
  data.voters.forEach(v => {
    vt.insertRow().innerHTML = `<td>${v.ward}</td><td>${v.name}</td><td>${v.phone}</td>`;
  });
  document.getElementById('totalVoter').innerText = data.voters.length;
  document.getElementById('totalLeader').innerText = data.leaders.length;
}
</script>

</body>
</html>
