<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মাসিক চাঁদা হিসাব - মেঘনা হিউম্যানিটি ফাউন্ডেশন</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
    body { font-family: 'Hind Siliguri', sans-serif; background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); padding: 15px; margin: 0; }
.container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-top: 5px solid #FFD700; }
    h1 { text-align: center; color: #1B5E20; font-weight: 700; margin-bottom: 5px; }
    h2 { text-align: center; color: #388E3C; font-weight: 600; margin-top: 0; }
.top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon { font-size: 32px; }
.admin-btn,.add-btn,.report-btn { background: linear-gradient(45deg, #1976D2, #42A5F5); color: white; padding: 10px 18px; border: none; border-radius: 50px; cursor: pointer; margin:5px; font-weight: 600; transition: 0.3s; box-shadow: 0 4px 10px rgba(25,118,210,0.3); }
.add-btn { background: linear-gradient(45deg, #2E7D32, #66BB6A); box-shadow: 0 4px 10px rgba(46,125,50,0.3); }
.report-btn { background: linear-gradient(45deg, #F9A825, #FFD54F); color: #1B5E20; box-shadow: 0 4px 10px rgba(249,168,37,0.3); }
.admin-btn:hover,.add-btn:hover,.report-btn:hover { transform: translateY(-2px); }
.del-btn { background: #E53935; color: white; border: none; padding: 5px 10px; border-radius: 20px; cursor: pointer; font-size: 12px; }
   .filter-box { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
    select, input { padding: 12px; border-radius: 10px; border: 2px solid #A5D6A7; width: 100%; font-size: 15px; }
    select { flex: 1; min-width: 150px; } #searchInput { flex: 3; min-width: 250px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; border-radius: 10px; overflow: hidden; }
    th { background: linear-gradient(45deg, #2E7D32, #43A047); color: white; padding: 14px 10px; text-align: center; }
    td { padding: 12px 10px; text-align: center; border-bottom: 1px solid #E0E0E0; }
    tr:hover { background: #F1F8E9; }
.paid { background: #C8E6C9; color: #1B5E20; font-weight: bold; border-radius: 20px; padding: 5px 10px; display: inline-block; }
.unpaid { background: #FFCDD2; color: #B71C1C; font-weight: bold; border-radius: 20px; padding: 5px 10px; display: inline-block; }
.clickable:hover { cursor: pointer; background: #DCEDC8!important; }
.summary { display: flex; justify-content: space-around; margin-top: 20px; font-size: 18px; font-weight: bold; flex-wrap: wrap; gap: 15px; }
.summary-card { background: #E8F5E9; padding: 15px 25px; border-radius: 15px; border-left: 5px solid #FFD700; }
.paid-count { color: #2E7D32; }
.unpaid-count { color: #C62828; }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999; overflow-y: auto; backdrop-filter: blur(5px); }
.modal-content { background: white; margin: 5% auto; padding: 30px; width: 90%; max-width: 500px; border-radius: 20px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.2); border-top: 5px solid #FFD700; }
.due-list { text-align: left; max-height: 400px; overflow-y: auto; }
.due-card { background: #FFF8E1; padding: 12px; margin: 10px 0; border-radius: 10px; border-left: 4px solid #FFA000; }
@media(max-width:768px){ table{font-size:12px;} th,td{padding:8px 4px;} }
</style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <div class="logo">
            <span class="logo-icon">🌿</span>
            <h1>মেঘনা হিউম্যানিটি ফাউন্ডেশন</h1>
        </div>
        <div>
            <button class="report-btn" onclick="showDueReport()">📊 বকেয়া রিপোর্ট</button>
            <button class="add-btn" onclick="showAddMember()" id="addBtn" style="display:none;">➕ সদস্য এড</button>
            <button class="admin-btn" onclick="adminLogin()" id="loginBtn">🔑 এডমিন লগিন</button>
            <button class="admin-btn" onclick="adminLogout()" id="logoutBtn" style="display:none;">🚪 লগআউট</button>
        </div>
    </div>
    <h2>মাসিক চাঁদার হিসাব 2026</h2>

    <div class="filter-box">
        <select id="monthSelect"></select>
        <input type="text" id="searchInput" placeholder="🔍 নাম, পদবী বা মোবাইল দিয়ে সার্চ করুন">
    </div>

    <div style="overflow-x:auto;">
    <table id="chadaTable">
        <thead><tr><th>ID</th><th>নাম</th><th>পদবী</th><th>মোবাইল</th><th>চাঁদা</th><th>স্ট্যাটাস</th><th id="actionHead" style="display:none;">একশন</th></tr></thead>
        <tbody></tbody>
    </table>
    </div>

    <div class="summary">
        <div class="summary-card"><span class="paid-count" id="paidCount"></span></div>
        <div class="summary-card"><span class="unpaid-count" id="unpaidCount"></span></div>
        <div class="summary-card"><span id="totalAmount"></span></div>
    </div>
</div>

<!-- লগিন মোডাল -->
<div id="loginModal" class="modal"><div class="modal-content">
    <h3>🔑 এডমিন লগিন</h3>
    <input type="password" id="passInput" placeholder="পাসওয়ার্ড দিন">
    <br><br><button class="admin-btn" onclick="checkPass()">লগিন</button> <button class="del-btn" onclick="closeModal('loginModal')">বাতিল</button>
</div></div>

<!-- সদস্য এড মোডাল -->
<div id="addModal" class="modal"><div class="modal-content">
    <h3>➕ নতুন সদস্য এড করুন</h3>
    <input type="text" id="newName" placeholder="নাম লিখুন"><br>
    <input type="text" id="newPodobi" placeholder="পদবী লিখুন - যেমন: সদস্য"><br>
    <input type="text" id="newMobile" placeholder="মোবাইল নাম্বার - 01XXXXXXXXX"><br>
    <input type="number" id="newAmount" placeholder="চাঁদার পরিমান - যেমন: 500"><br>
    <button class="add-btn" onclick="addMember()">সেভ করুন</button> <button class="del-btn" onclick="closeModal('addModal')">বাতিল</button>
</div></div>

<!-- বকেয়া রিপোর্ট মোডাল -->
<div id="reportModal" class="modal"><div class="modal-content">
    <h3>📊 সকল বকেয়া রিপোর্ট</h3>
    <div id="dueList" class="due-list"></div>
    <br><button class="admin-btn" onclick="closeModal('reportModal')">বন্ধ করুন</button>
</div></div>

<!-- কনফার্ম মোডাল -->
<div id="confirmModal" class="modal"><div class="modal-content">
    <h3 id="confirmText"></h3>
    <br><button style="background:#2E7D32;color:white;padding:10px 20px;border:none;border-radius:50px;">হ্যাঁ, কনফার্ম</button>
    <button style="background:#C62828;color:white;padding:10px 20px;border:none;border-radius:50px;" onclick="closeModal('confirmModal')">না</button>
</div></div>

<script>
const months = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
const ADMIN_PASS = "mhf2026";
let isAdmin = false;
let tempAction = null;

let members = JSON.parse(localStorage.getItem('mhf_members')) || [
  {"id": 1, "name": "মোহাম্মদ রাব্বুল", "podobi": "উপদেষ্টা", "mobile": "01711111", "amount": 1000},
  {"id": 2, "name": "আব্দুল কাদের", "podobi": "সভাপতি", "mobile": "01722222222", "amount": 800}
];
let payments = JSON.parse(localStorage.getItem('mhf_payments')) || {};

const monthSelect = document.getElementById('monthSelect');
months.forEach(m => monthSelect.innerHTML += `<option>${m}</option>`);
monthSelect.value = "আগস্ট";

function saveData(){
    localStorage.setItem('mhf_members', JSON.stringify(members));
    localStorage.setItem('mhf_payments', JSON.stringify(payments));
}

function loadTable(){
    const month = monthSelect.value;
    const search = document.getElementById('searchInput').value.toLowerCase();
    const tbody = document.querySelector('#chadaTable tbody');
    tbody.innerHTML = '';
    let total = 0, paid = 0, unpaid = 0;

    members.filter(x => x.name.toLowerCase().includes(search) || x.podobi.toLowerCase().includes(search) || x.mobile.includes(search))
.forEach(x => {
        const fixedAmount = x.amount || 500;
        const isPaid = payments[month] && payments[month][x.id];
        const amount = isPaid? fixedAmount : 0;
        total += amount;
        if(isPaid) paid++; else unpaid++;

        const statusClass = isPaid? 'paid' : 'unpaid';
        const statusText = isPaid? `✓ ${fixedAmount} টাকা` : `✗ বকেয়া`;
        const clickClass = isAdmin? 'clickable' : '';
        const delBtn = isAdmin? `<button class="del-btn" onclick="event.stopPropagation(); askDelete(${x.id})">মুছুন</button>` : '';

        tbody.innerHTML += `<tr class="${clickClass}" onclick="askPayment(${x.id}, '${x.name}')">
            <td>${x.id}</td><td><b>${x.name}</b></td><td>${x.podobi}</td><td>${x.mobile}</td>
            <td>${fixedAmount} ৳</td>
            <td><span class="${statusClass}">${statusText}</span></td>
            <td>${delBtn}</td>
        </tr>`;
    });
    document.getElementById('paidCount').innerText = `দিয়েছেন: ${paid} জন`;
    document.getElementById('unpaidCount').innerText = `বাকি: ${unpaid} জন`;
    document.getElementById('totalAmount').innerText = `মোট আদায়: ${total} ৳`;
}

function showDueReport(){
    let html = '';
    members.forEach(member => {
        let dueMonths = [];
        months.forEach(m => {
            if(!payments[m] ||!payments[m][member.id]){
                dueMonths.push(m);
            }
        });
        if(dueMonths.length > 0){
            html += `<div class="due-card"><b>${member.name}</b> - ${member.mobile}<br><small>বকেয়া মাস: ${dueMonths.join(', ')}</small></div>`;
        }
    });
    document.getElementById('dueList').innerHTML = html == ''? '<p style="color:green;">🎉 কোন বকেয়া নাই</p>' : html;
    document.getElementById('reportModal').style.display = 'block';
}

function askPayment(id, name){
    if(!isAdmin) return alert("এডমিন লগিন করুন");
    const month = monthSelect.value;
    const isPaid = payments[month] && payments[month][id];
    const action = isPaid? "বকেয়া" : "আদায়";
    document.getElementById('confirmText').innerText = `${name} এর ${month} মাসের চাঁদা ${action} মার্ক করবেন?`;
    tempAction = () => doPayment(id);
    document.getElementById('confirmModal').style.display = 'block';
}

function doPayment(id){
    const month = monthSelect.value;
    if(!payments[month]) payments[month] = {};
    payments[month][id] =!payments[month][id];
    saveData(); loadTable();
}

function askDelete(id){
    const member = members.find(m => m.id == id);
    document.getElementById('confirmText').innerText = `${member.name} কে মুছে ফেলবেন?`;
    tempAction = () => deleteMember(id);
    document.getElementById('confirmModal').style.display = 'block';
}

function deleteMember(id){
    members = members.filter(m => m.id!= id);
    saveData(); loadTable();
}

function confirmAction(){
    if(tempAction) tempAction();
    closeModal('confirmModal');
}

function showAddMember(){ document.getElementById('addModal').style.display = 'block'; }
function addMember(){
    const name = document.getElementById('newName').value;
    const podobi = document.getElementById('newPodobi').value;
    const mobile = document.getElementById('newMobile').value;
    const amount = parseInt(document.getElementById('newAmount').value);
    if(name == "" || podobi == "" || mobile == "" ||!amount) return alert("সব ঘর পূরন করুন");
    const newId = members.length > 0? Math.max(...members.map(m => m.id)) + 1 : 1;
    members.push({id: newId, name: name, podobi: podobi, mobile: mobile, amount: amount});
    saveData(); loadTable(); closeModal('addModal');
    document.getElementById('newName').value = "";
    document.getElementById('newPodobi').value = "";
    document.getElementById('newMobile').value = "";
    document.getElementById('newAmount').value = "";
}

function adminLogin(){ document.getElementById('loginModal').style.display = 'block'; }
function closeModal(id){ document.getElementById(id).style.display = 'none'; }
function checkPass(){
    if(document.getElementById('passInput').value === ADMIN_PASS){
        isAdmin = true;
        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'inline-block';
        document.getElementById('addBtn').style.display = 'inline-block';
        document.getElementById('actionHead').style.display = 'table-cell';
        alert("এডমিন লগিন সফল!");
        closeModal('loginModal'); loadTable();
    } else { alert("ভুল পাসওয়ার্ড"); }
}
function adminLogout(){
    isAdmin = false;
    document.getElementById('loginBtn').style.display = 'inline-block';
    document.getElementById('logoutBtn').style.display = 'none';
    document.getElementById('addBtn').style.display = 'none';
    document.getElementById('actionHead').style.display = 'none';
    loadTable();
}

monthSelect.onchange = loadTable;
document.getElementById('searchInput').onkeyup = loadTable;
loadTable();
</script>
</body>
</html>
